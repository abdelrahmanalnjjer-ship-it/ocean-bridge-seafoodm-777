[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# minimumReleaseAgeExcludes used to sit here, listing six packages from the
# old no-code platform that were allowed to skip the guard. Those are gone, so
# the exception list went with them — the guard now applies to everything.
